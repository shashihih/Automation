name: Jira User Story Automation

on:
  workflow_dispatch:

jobs:
  run-jira-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Authenticate and Connect to Atlassian Rovo MCP
        env:
          ATLASSIAN_AUTH: ${{ secrets.ATLASSIAN_AUTH }}
        run: |
          echo "Verifying Atlassian Authentication Secret..."
          if [ -z "$ATLASSIAN_AUTH" ]; then
            echo "Error: ATLASSIAN_AUTH secret is missing!"
            exit 1
          else
            echo "ATLASSIAN_AUTH secret loaded successfully."
            echo "Ready to interact with Jira Rovo MCP & automate user story AI-3."
          fi
